<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<meta name="theme-color" content="#3d0a1a" />
<title>Special Place ✨💖</title>
<style>
/* ================= RESET & GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Poppins',system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
:root{
  --red:#ff1a5e;
  --pink:#ff4d6d;
  --rose:#ff8fb8;
  --violet:#c77dff;
  --glow:#ff0066;
  --gold:#ffd97a;
  --gold-deep:#ffb347;
  --diamond:#fff4d6;
  --burgundy-deep:#1a0308;
  --burgundy:#3d0a1a;
  --crimson:#5c0f22;
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% 10%, #6b0f22 0%, transparent 55%),
    radial-gradient(ellipse at 80% 90%, #4a0816 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, #3d0a1a 0%, #1a0308 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;position:relative;padding:1rem;color:#f5e6ff;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeSpeed;
}

/* ================= FLORAL BOKEH BACKGROUND (Pure CSS, GPU-accelerated) ================= */
.bg-floral{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  transform:translateZ(0);
}
/* Soft glowing bokeh circles */
.bokeh{
  position:absolute;
  border-radius:50%;
  filter:blur(28px);
  opacity:.35;
  will-change:transform,opacity;
  animation:bokehFloat 14s ease-in-out infinite alternate;
}
.bokeh.b1{width:180px;height:180px;background:radial-gradient(circle,#ff4d6d,transparent 70%);top:8%;left:5%;animation-delay:0s}
.bokeh.b2{width:220px;height:220px;background:radial-gradient(circle,#c77dff,transparent 70%);top:60%;left:80%;animation-delay:2s}
.bokeh.b3{width:140px;height:140px;background:radial-gradient(circle,#ffd97a,transparent 70%);top:35%;left:45%;animation-delay:4s;opacity:.22}
.bokeh.b4{width:200px;height:200px;background:radial-gradient(circle,#ff8fb8,transparent 70%);top:75%;left:15%;animation-delay:6s}
.bokeh.b5{width:160px;height:160px;background:radial-gradient(circle,#ff4d6d,transparent 70%);top:15%;left:70%;animation-delay:8s;opacity:.28}
.bokeh.b6{width:120px;height:120px;background:radial-gradient(circle,#ffd97a,transparent 70%);top:85%;left:50%;animation-delay:3s;opacity:.2}
@keyframes bokehFloat{
  0%{transform:translate3d(0,0,0) scale(1);opacity:.25}
  50%{opacity:.45}
  100%{transform:translate3d(30px,-40px,0) scale(1.15);opacity:.3}
}

/* Subtle floral pattern (SVG inline as data URI - lightweight) */
.floral-pattern{
  position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><g fill='none' stroke='%23ff8fb8' stroke-width='0.6' opacity='0.13'><circle cx='50' cy='50' r='8'/><circle cx='50' cy='50' r='14'/><circle cx='50' cy='50' r='20'/><circle cx='150' cy='150' r='10'/><circle cx='150' cy='150' r='18'/><circle cx='150' cy='150' r='26'/><path d='M100 20 Q110 40 100 60 Q90 40 100 20 Z'/><path d='M20 100 Q40 110 60 100 Q40 90 20 100 Z'/><path d='M140 100 Q160 110 180 100 Q160 90 140 100 Z'/></g></svg>");
  opacity:.55;
  background-size:280px 280px;
  animation:floralDrift 60s linear infinite;
}
@keyframes floralDrift{
  0%{background-position:0 0}
  100%{background-position:280px 280px}
}

/* Rose petals floating */
.petal{
  position:absolute;
  width:14px;height:14px;
  background:radial-gradient(ellipse at 30% 30%,#ff8fb8,#c72a5c 70%);
  border-radius:50% 0 50% 0;
  opacity:.55;
  filter:drop-shadow(0 0 6px rgba(255,77,109,.6));
  will-change:transform;
  animation:petalFall 16s linear infinite;
}
@keyframes petalFall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg) scale(.8);opacity:0}
  10%{opacity:.7}
  90%{opacity:.5}
  100%{transform:translate3d(-60px,110vh,0) rotate(720deg) scale(1);opacity:0}
}

/* Sparkles */
.sparkle{
  position:absolute;
  width:4px;height:4px;
  background:#fff4d6;
  border-radius:50%;
  box-shadow:0 0 8px #ffd97a,0 0 16px #ff8fb8;
  will-change:transform,opacity;
  animation:sparkleTwinkle 5s ease-in-out infinite;
}
@keyframes sparkleTwinkle{
  0%,100%{opacity:0;transform:scale(.4)}
  50%{opacity:1;transform:scale(1.4)}
}

/* ================= ADMIN TRIGGER ================= */
.admin-portal{position:fixed;top:1.1rem;right:1.1rem;z-index:100}
.admin-trigger{
  background:rgba(92,15,34,.6);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,180,215,.45);
  color:#ffd97a;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;cursor:pointer;
  transition:transform .3s,background .3s,box-shadow .3s,color .3s;
  box-shadow:0 0 18px rgba(255,26,94,.5);
  will-change:transform;
  -webkit-tap-highlight-color:transparent;
}
.admin-trigger:hover,.admin-trigger:focus{
  background:var(--red);color:#fff;transform:rotate(15deg) scale(1.08);
  box-shadow:0 0 35px var(--red),0 0 70px var(--pink);
  border-color:#ffd97a;outline:none;
}

/* ================= MAIN CONTAINER ================= */
.app-container{
  position:relative;z-index:10;width:100%;max-width:1100px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.6rem;padding:1rem;
}

/* ================= ✨ HERO SECTION (Floral Luxury) ✨ ================= */
.hero{
  width:100%;
  display:flex;
  justify-content:center;
  padding:1rem;
  animation:fadeInDown .9s ease-out;
  perspective:1400px;
}

.hero-card{
  position:relative;
  width:100%;
  max-width:820px;
  padding:clamp(2rem,6vw,3.4rem) clamp(1.4rem,5vw,3rem);
  border-radius:52px;
  background:
    linear-gradient(155deg,rgba(107,15,34,.5) 0%,rgba(61,10,26,.42) 45%,rgba(92,15,34,.5) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  backdrop-filter:blur(24px) saturate(150%);
  border:1.5px solid rgba(255,180,215,.5);
  box-shadow:
    0 30px 80px rgba(0,0,0,.65),
    0 0 70px rgba(255,26,94,.4),
    0 0 140px rgba(199,125,255,.25),
    0 0 200px rgba(255,215,140,.12),
    inset 0 1px 0 rgba(255,220,235,.3),
    inset 0 -30px 80px rgba(255,0,100,.15),
    inset 0 0 90px rgba(255,180,215,.1);
  overflow:hidden;
  isolation:isolate;
  transform-style:preserve-3d;
  animation:heroBreathe 7s ease-in-out infinite;
  will-change:transform;
}
@keyframes heroBreathe{
  0%,100%{transform:translate3d(0,0,0) rotateX(0deg)}
  50%{transform:translate3d(0,-6px,0) rotateX(.6deg)}
}

/* Glowing floral border ring */
.hero-card::before{
  content:'';
  position:absolute;inset:-2px;
  border-radius:54px;
  padding:2.5px;
  background:conic-gradient(
    from 0deg,
    rgba(255,143,184,0) 0%,
    #ff8fb8 12%,
    #ffd97a 25%,
    #ff4d6d 38%,
    #c77dff 52%,
    #ffd97a 66%,
    #ff8fb8 80%,
    rgba(255,143,184,0) 100%
  );
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.9;
  filter:blur(.4px);
  animation:ringSpin 10s linear infinite;
  pointer-events:none;
  z-index:-1;
}
@keyframes ringSpin{
  to{transform:rotate(360deg)}
}

/* Ambient inner light sweeps */
.hero-card::after{
  content:'';
  position:absolute;
  top:-60%;left:-30%;
  width:160%;height:220%;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,180,210,.22) 0%,transparent 45%),
    radial-gradient(ellipse at 75% 80%,rgba(199,125,255,.18) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(255,215,140,.12) 0%,transparent 60%);
  filter:blur(32px);
  animation:lightDrift 12s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:-1;
}
@keyframes lightDrift{
  0%{transform:translate3d(-3%,-2%,0) rotate(0deg)}
  100%{transform:translate3d(3%,2%,0) rotate(6deg)}
}

/* Floral corner accents on card */
.hero-floral{
  position:absolute;
  font-size:clamp(1.6rem,4vw,2.6rem);
  opacity:.85;
  filter:drop-shadow(0 0 10px #ffd97a) drop-shadow(0 0 20px #ff8fb8);
  pointer-events:none;
  animation:floralPulse 4s ease-in-out infinite alternate;
  z-index:1;
}
.hero-floral.tl{top:12px;left:16px}
.hero-floral.tr{top:12px;right:16px}
.hero-floral.bl{bottom:12px;left:16px}
.hero-floral.br{bottom:12px;right:16px}
@keyframes floralPulse{
  0%{opacity:.7;transform:scale(1) rotate(0deg)}
  100%{opacity:1;transform:scale(1.12) rotate(8deg)}
}

/* Sparkles on card */
.hero-spark{
  position:absolute;
  width:10px;height:10px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,#fff 0%,#ffd97a 45%,transparent 70%);
  filter:drop-shadow(0 0 8px #ffd97a) drop-shadow(0 0 16px #ff8fb8);
  animation:sparkPulse 3s ease-in-out infinite;
  opacity:0;
}
.hero-spark.s1{top:14%;left:8%;animation-delay:0s}
.hero-spark.s2{top:22%;right:10%;animation-delay:.9s}
.hero-spark.s3{bottom:18%;left:14%;animation-delay:1.8s}
.hero-spark.s4{bottom:26%;right:8%;animation-delay:2.4s}
.hero-spark.s5{top:50%;right:4%;animation-delay:1.2s}
.hero-spark.s6{top:60%;left:5%;animation-delay:2.1s}
@keyframes sparkPulse{
  0%,100%{opacity:0;transform:scale(.6)}
  50%{opacity:1;transform:scale(1.4)}
}

/* --- HERO TEXT (Gold & Diamond Shine) --- */
.hero-title{
  position:relative;
  z-index:2;
  text-align:center;
  font-size:clamp(2rem,8.5vw,4.4rem);
  font-weight:900;
  letter-spacing:.015em;
  line-height:1.15;
  margin-bottom:.9rem;
  font-family:'Georgia','Playfair Display',serif;
  background:linear-gradient(
    100deg,
    #fff4d6 0%,
    #ffd97a 18%,
    #ffb347 30%,
    #fff4d6 42%,
    #ffd97a 55%,
    #ff8fb8 72%,
    #ffd97a 88%,
    #fff4d6 100%
  );
  background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  -webkit-text-stroke:.6px rgba(255,244,214,.2);
  filter:
    drop-shadow(0 0 14px rgba(255,215,140,.85))
    drop-shadow(0 0 30px rgba(255,143,184,.7))
    drop-shadow(0 0 55px rgba(255,26,94,.55))
    drop-shadow(0 3px 2px rgba(0,0,0,.55));
  animation:
    gradientShift 7s linear infinite,
    titleFloat 5.5s ease-in-out infinite,
    titleBreathe 3.6s ease-in-out infinite alternate;
  will-change:transform,filter,background-position;
  transform:translateZ(40px);
  word-break:break-word;
}
@keyframes gradientShift{
  0%{background-position:0% 50%}
  100%{background-position:280% 50%}
}
@keyframes titleFloat{
  0%,100%{transform:translate3d(0,0,40px) rotateX(0deg)}
  50%{transform:translate3d(0,-6px,40px) rotateX(1.2deg)}
}
@keyframes titleBreathe{
  0%{
    filter:
      drop-shadow(0 0 12px rgba(255,215,140,.8))
      drop-shadow(0 0 26px rgba(255,143,184,.65))
      drop-shadow(0 0 48px rgba(255,26,94,.5));
  }
  100%{
    filter:
      drop-shadow(0 0 22px rgba(255,244,214,.95))
      drop-shadow(0 0 48px rgba(255,215,140,.9))
      drop-shadow(0 0 85px rgba(255,143,184,.75))
      drop-shadow(0 0 120px rgba(255,26,94,.65));
  }
}

/* Subtitle (elegant curved style) */
.hero-subtitle-wrap{
  position:relative;
  z-index:2;
  text-align:center;
  margin-top:.8rem;
  overflow:hidden;
}
.hero-subtitle{
  display:inline-block;
  font-size:clamp(.95rem,3.3vw,1.32rem);
  font-weight:300;
  font-style:italic;
  letter-spacing:.8px;
  color:#fff4d6;
  padding:.75rem 1.9rem;
  border-radius:80px 20px 80px 20px;
  background:linear-gradient(90deg,rgba(255,77,109,.2),rgba(199,125,255,.22),rgba(255,215,140,.2));
  border:1px solid rgba(255,215,140,.55);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  box-shadow:0 0 28px rgba(255,77,109,.4),inset 0 0 22px rgba(255,215,140,.18);
  text-shadow:0 0 12px rgba(255,215,140,.8),0 0 28px rgba(255,143,184,.6);
  animation:subtitleGlow 4s ease-in-out infinite alternate, subtitleFloat 6s ease-in-out infinite;
  will-change:transform,box-shadow;
  word-break:break-word;
  font-family:'Georgia','Cormorant Garamond',serif;
}
@keyframes subtitleGlow{
  0%{box-shadow:0 0 22px rgba(255,77,109,.35),inset 0 0 18px rgba(255,215,140,.14)}
  100%{box-shadow:0 0 48px rgba(255,215,140,.65),0 0 80px rgba(255,143,184,.35),inset 0 0 28px rgba(255,215,140,.28)}
}
@keyframes subtitleFloat{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,-3px,0)}
}

.hero-divider{
  position:relative;
  z-index:2;
  width:60%;
  max-width:340px;
  height:2px;
  margin:1.2rem auto .2rem;
  background:linear-gradient(90deg,transparent,#ffd97a,#ff4d6d,#c77dff,#ffd97a,transparent);
  border-radius:2px;
  box-shadow:0 0 14px #ffd97a,0 0 28px #ff4d6d,0 0 45px rgba(199,125,255,.6);
  animation:dividerPulse 3.5s ease-in-out infinite alternate;
}
@keyframes dividerPulse{
  0%{opacity:.6;transform:scaleX(.95)}
  100%{opacity:1;transform:scaleX(1.05)}
}

@keyframes fadeInDown{from{opacity:0;transform:translate3d(0,-40px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* ================= STORY FOLDER (3D Glass + Floral) ================= */
.story-folder-wrapper{perspective:1200px;width:100%;display:flex;justify-content:center}
.story-folder{
  background:linear-gradient(145deg,rgba(107,15,34,.6),rgba(61,10,26,.72));
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-radius:46px;padding:2.2rem 2.5rem;
  display:flex;flex-direction:column;align-items:center;gap:1.4rem;
  border:1.5px solid rgba(255,180,215,.55);
  box-shadow:
    0 25px 55px rgba(0,0,0,.75),
    0 0 50px rgba(255,26,94,.5),
    0 0 100px rgba(255,215,140,.2),
    inset 0 0 45px rgba(255,143,184,.15);
  transition:transform .45s cubic-bezier(.2,.9,.4,1),box-shadow .45s,border-color .45s;
  cursor:pointer;width:100%;max-width:560px;position:relative;
  animation:floatCard 5s infinite alternate ease-in-out;
  transform-style:preserve-3d;will-change:transform;
  -webkit-tap-highlight-color:transparent;outline:none;
}
.story-folder::before{
  content:'';position:absolute;inset:-3px;border-radius:49px;padding:3px;
  background:linear-gradient(135deg,#ffd97a,#ff4d6d,#c77dff,#ff8fb8,#ffd97a);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.8;animation:borderPulse 3s infinite alternate;pointer-events:none;z-index:-1;
}
@keyframes borderPulse{0%{opacity:.55;filter:blur(2px)}100%{opacity:1;filter:blur(0)}}

.story-folder::after{
  content:'';
  position:absolute;inset:0;border-radius:46px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,215,140,.25) 0%,transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(255,77,109,.25) 0%,transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(199,125,255,.16) 0%,transparent 55%);
  opacity:0;
  transition:opacity .5s ease;
  pointer-events:none;
  z-index:0;
}
.story-folder:hover::after{opacity:1;animation:sparkleShift 4s ease-in-out infinite alternate}
@keyframes sparkleShift{
  0%{transform:scale(1) rotate(0deg)}
  100%{transform:scale(1.05) rotate(3deg)}
}

.story-folder:hover,.story-folder:focus{
  transform:scale(1.03) translate3d(0,-10px,0) rotateY(2deg);
  border-color:#ffd97a;
  box-shadow:
    0 35px 75px rgba(0,0,0,.85),
    0 0 100px var(--red),
    0 0 160px rgba(255,215,140,.5),
    inset 0 0 65px rgba(255,0,128,.4);
}
@keyframes floatCard{
  0%{transform:translate3d(0,0,0) rotateY(0)}
  100%{transform:translate3d(0,-12px,0) rotateY(1.5deg)}
}

/* Floral rose decoration on folder */
.folder-floral{
  position:absolute;
  font-size:1.5rem;
  opacity:.85;
  filter:drop-shadow(0 0 8px #ffd97a) drop-shadow(0 0 16px #ff8fb8);
  pointer-events:none;
  animation:floralPulse 4s ease-in-out infinite alternate;
  z-index:2;
}
.folder-floral.f1{top:10px;left:14px;animation-delay:0s}
.folder-floral.f2{top:10px;right:14px;animation-delay:1s}
.folder-floral.f3{bottom:10px;left:14px;animation-delay:2s}
.folder-floral.f4{bottom:10px;right:14px;animation-delay:3s}

.folder-icon-3d{
  position:relative;z-index:1;
  font-size:5.2rem;line-height:1;
  filter:drop-shadow(0 0 22px var(--glow)) drop-shadow(0 0 45px var(--pink));
  transition:transform .4s cubic-bezier(.2,.9,.4,1),filter .4s;
  transform-style:preserve-3d;animation:iconGlow 2s infinite alternate;
  will-change:transform,filter;
}
@keyframes iconGlow{
  0%{filter:drop-shadow(0 0 15px #ff4d6d) drop-shadow(0 0 30px #ff0066)}
  100%{filter:drop-shadow(0 0 32px #ffd97a) drop-shadow(0 0 65px #c77dff) drop-shadow(0 0 95px #ff4d6d)}
}
.story-folder:hover .folder-icon-3d{
  transform:rotateY(18deg) rotateX(8deg) scale(1.12);
  filter:drop-shadow(0 0 42px #ffd97a) drop-shadow(0 0 85px #ff4d6d) drop-shadow(0 0 130px #c77dff);
}
.folder-title{
  position:relative;z-index:1;
  font-size:clamp(1.55rem,5vw,2.15rem);font-weight:700;
  text-shadow:0 0 15px var(--red),0 0 30px var(--glow),0 0 55px #b3005e;
  letter-spacing:1px;text-align:center;
  font-family:'Georgia','Playfair Display',serif;
  background:linear-gradient(135deg,#fff4d6,#ffd97a,#ff8fb8,#ffd97a,#fff4d6);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px #ff4d6d);
  animation:folderTitleShift 5s linear infinite;
}
@keyframes folderTitleShift{
  0%{background-position:0% 50%}
  100%{background-position:220% 50%}
}
.open-btn{
  position:relative;z-index:1;
  background:linear-gradient(145deg,#ff1a5e,#b3004b);
  border:none;padding:1rem 2.6rem;border-radius:60px;
  font-size:1.2rem;font-weight:600;color:#fff4d6;letter-spacing:1px;
  cursor:pointer;box-shadow:0 0 25px var(--red),0 10px 25px -5px #000;
  transition:box-shadow .35s,transform .35s;text-shadow:0 0 10px #fff;
  border:1px solid rgba(255,215,140,.6);display:flex;align-items:center;gap:10px;
  margin-top:.4rem;pointer-events:none;overflow:hidden;
  font-family:'Georgia',serif;
}
.open-btn::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transition:left .6s;
}
.story-folder:hover .open-btn::after{left:100%}
.story-folder:hover .open-btn{
  box-shadow:
    0 0 50px #ff4d6d,
    0 0 100px rgba(255,215,140,.65),
    0 0 155px rgba(255,0,102,.6),
    0 15px 35px -5px #000;
  transform:scale(1.04);
}

/* ================= MODAL (Vintage Book) ================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,3,10,.87);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;padding:1rem;
}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-content{
  background:
    linear-gradient(165deg,rgba(92,15,34,.92) 0%,rgba(45,8,22,.95) 50%,rgba(61,10,26,.94) 100%);
  -webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);
  border-radius:52px;width:100%;max-width:800px;max-height:90vh;
  padding:2.2rem 2.2rem 1.6rem;border:2px solid rgba(255,215,140,.6);
  box-shadow:
    0 0 120px #b3005e,
    0 0 200px rgba(255,0,102,.4),
    0 0 280px rgba(255,215,140,.18),
    inset 0 0 60px rgba(255,143,184,.28);
  display:flex;flex-direction:column;gap:1.1rem;

<script>
(function(){
  'use strict';

  // ================= CONFIG =================
  const ADMIN_EMAIL = "okjan218@gmail.com";
  const ADMIN_PASSWORD = "016450";

  const KEY_WELCOME_TITLE = 'sp_welcome_title_v2';
  const KEY_WELCOME_SUB   = 'sp_welcome_sub_v2';
  const KEY_STORY         = 'sp_story_v2';

  const DEFAULT_TITLE = 'Welcome, Akhi Moni ✨💖';
  const DEFAULT_SUB   = 'বন্ধুর তৈরি করা এই বিশেষ কোণে তোমাকে স্বাগতম!';
  const DEFAULT_STORY = `
<p>✨ এক ছিল ছোট্ট রাজকুমারী, নাম তার আখি মনি... ✨</p>
<p>🌸 শৈশবের সেই মিষ্টি দিনগুলো, প্রথম দেখা, লুকিয়ে তাকানো, আর মনের কোণে গোপন ভালোবাসা — সব এখানে ফুটে উঠবে।</p>
<p>💖 এই গল্পটি এখনো লেখা হয়নি। অ্যাডমিন পোর্টাল থেকে গল্প লিখে সেভ করুন।</p>
`.trim();

  // ================= STORAGE HELPERS =================
  function safeGet(key, fallback){
    try {
      const v = localStorage.getItem(key);
      return (v === null || v === '') ? fallback : v;
    } catch(e){ return fallback; }
  }
  function safeSet(key, value){
    try { localStorage.setItem(key, value); return true; } catch(e){ return false; }
  }

  // ================= DOM REFS =================
  const heroTitle = document.getElementById('heroTitle');
  const heroSubtitle = document.getElementById('heroSubtitle');

  const storyFolder = document.getElementById('storyFolder');
  const modalOverlay = document.getElementById('modalOverlay');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const storyText = document.getElementById('storyText');
  const scrollProgressBar = document.getElementById('scrollProgressBar');

  const adminTrigger = document.getElementById('adminTrigger');
  const adminPanelOverlay = document.getElementById('adminPanelOverlay');
  const adminLoginView = document.getElementById('adminLoginView');
  const adminEditorView = document.getElementById('adminEditorView');
  const adminEmail = document.getElementById('adminEmail');
  const adminPassword = document.getElementById('adminPassword');
  const loginMessage = document.getElementById('loginMessage');
  const loginBtn = document.getElementById('loginBtn');
  const closeAdminLoginBtn = document.getElementById('closeAdminLoginBtn');
  const closeEditorBtn = document.getElementById('closeEditorBtn');

  const welcomeTitleInput = document.getElementById('welcomeTitleInput');
  const welcomeSubtitleInput = document.getElementById('welcomeSubtitleInput');
  const welcomeMessage = document.getElementById('welcomeMessage');
  const saveWelcomeBtn = document.getElementById('saveWelcomeBtn');
  const resetWelcomeBtn = document.getElementById('resetWelcomeBtn');

  const storyInput = document.getElementById('storyInput');
  const editorMessage = document.getElementById('editorMessage');
  const saveStoryBtn = document.getElementById('saveStoryBtn');
  const resetStoryBtn = document.getElementById('resetStoryBtn');

  const tabs = document.querySelectorAll('.admin-tab');
  const tabPanels = document.querySelectorAll('.admin-tab-panel');

  // ================= CSS-ONLY PARTICLES (Rose petals & sparkles) =================
  function createPetalsAndSparkles(){
    const bg = document.querySelector('.bg-floral');
    const isMobile = window.innerWidth < 600;
    const petalCount = isMobile ? 8 : 14;
    const sparkleCount = isMobile ? 12 : 22;

    // Rose petals
    for(let i = 0; i < petalCount; i++){
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.left = (Math.random() * 100) + '%';
      p.style.animationDelay = (Math.random() * 16) + 's';
      p.style.animationDuration = (Math.random() * 8 + 12) + 's';
      p.style.width = (Math.random() * 10 + 10) + 'px';
      p.style.height = p.style.width;
      const rotate = Math.random() * 360;
      p.style.transform = 'rotate(' + rotate + 'deg)';
      p.style.opacity = (Math.random() * 0.4 + 0.3).toFixed(2);
      bg.appendChild(p);
    }

    // Sparkles
    for(let i = 0; i < sparkleCount; i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.animationDelay = (Math.random() * 5) + 's';
      s.style.animationDuration = (Math.random() * 3 + 3) + 's';
      const size = Math.random() * 3 + 2;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      bg.appendChild(s);
    }
  }
  createPetalsAndSparkles();

  // ================= RENDER DYNAMIC CONTENT =================
  function renderWelcome(){
    const title = safeGet(KEY_WELCOME_TITLE, DEFAULT_TITLE);
    const sub   = safeGet(KEY_WELCOME_SUB,   DEFAULT_SUB);
    heroTitle.textContent = title;
    heroSubtitle.textContent = sub;
    document.title = title.replace(/[^\w\s\u0980-\u09FF]/g,'').trim() || 'Special Place';
  }

  function renderStory(){
    const saved = safeGet(KEY_STORY, DEFAULT_STORY);
    storyText.innerHTML = saved;
  }

  renderWelcome();
  renderStory();

  // ================= MODAL =================
  let bodyOverflowPrev = '';
  function lockBody(){ bodyOverflowPrev = document.body.style.overflow; document.body.style.overflow = 'hidden'; }
  function unlockBody(){ document.body.style.overflow = bodyOverflowPrev; }

  function openModal(){
    modalOverlay.classList.add('active');
    lockBody();
    closeModalBtn.focus({preventScroll:true});
    storyText.scrollTop = 0;
    updateScrollProgress();
  }
  function closeModal(){
    modalOverlay.classList.remove('active');
    unlockBody();
  }

  storyFolder.addEventListener('click', openModal);
  storyFolder.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(); }
  });
  closeModalBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){ if(e.target === modalOverlay) closeModal(); });

  // ================= SCROLL PROGRESS =================
  let progressRaf = null;
  function updateScrollProgress(){
    const el = storyText;
    const max = el.scrollHeight - el.clientHeight;
    const pct = max > 0 ? (el.scrollTop / max) * 100 : 0;
    scrollProgressBar.style.width = pct + '%';
  }
  storyText.addEventListener('scroll', function(){
    if(progressRaf) return;
    progressRaf = requestAnimationFrame(function(){
      updateScrollProgress();
      progressRaf = null;
    });
  }, {passive:true});

  // ================= ADMIN PANEL =================
  function resetAdminView(){
    adminLoginView.classList.remove('hidden');
    adminEditorView.classList.add('hidden');
    loginMessage.textContent = '';
    loginMessage.classList.remove('success');
    welcomeMessage.textContent = '';
    welcomeMessage.classList.remove('success');
    editorMessage.textContent = '';
    editorMessage.classList.remove('success');
    adminEmail.value = '';
    adminPassword.value = '';
    tabs.forEach(function(t){ t.classList.remove('active'); });
    tabPanels.forEach(function(p){ p.classList.remove('active'); });
    document.querySelector('.admin-tab[data-tab="welcome"]').classList.add('active');
    document.getElementById('tab-welcome').classList.add('active');
  }

  function openAdmin(){
    adminPanelOverlay.classList.add('active');
    lockBody();
    resetAdminView();
    setTimeout(function(){ adminEmail.focus({preventScroll:true}); }, 200);
  }
  function closeAdmin(){
    adminPanelOverlay.classList.remove('active');
    unlockBody();
    adminEmail.value = '';
    adminPassword.value = '';
  }

  adminTrigger.addEventListener('click', openAdmin);
  adminTrigger.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openAdmin(); }
  });
  closeAdminLoginBtn.addEventListener('click', closeAdmin);
  closeEditorBtn.addEventListener('click', closeAdmin);
  adminPanelOverlay.addEventListener('click', function(e){
    if(e.target === adminPanelOverlay) closeAdmin();
  });

  // LOGIN
  loginBtn.addEventListener('click', function(){
    const email = adminEmail.value.trim();
    const pass  = adminPassword.value;
    if(email === ADMIN_EMAIL && pass === ADMIN_PASSWORD){
      adminLoginView.classList.add('hidden');
      adminEditorView.classList.remove('hidden');
      welcomeTitleInput.value = safeGet(KEY_WELCOME_TITLE, DEFAULT_TITLE);
      welcomeSubtitleInput.value = safeGet(KEY_WELCOME_SUB, DEFAULT_SUB);
      storyInput.value = safeGet(KEY_STORY, DEFAULT_STORY);
    } else {
      loginMessage.textContent = '❌ Invalid email or password. Try again.';
      loginMessage.classList.remove('success');
    }
  });

  adminPassword.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); loginBtn.click(); }
  });
  adminEmail.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); adminPassword.focus(); }
  });

  // TABS
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tabPanels.forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      const target = document.getElementById('tab-' + tab.dataset.tab);
      if(target) target.classList.add('active');
    });
  });

  // SAVE WELCOME
  saveWelcomeBtn.addEventListener('click', function(){
    const title = welcomeTitleInput.value.trim();
    const sub = welcomeSubtitleInput.value.trim();
    if(!title){
      welcomeMessage.textContent = '⚠️ Welcome heading cannot be empty.';
      welcomeMessage.classList.remove('success');
      return;
    }
    const ok1 = safeSet(KEY_WELCOME_TITLE, title);
    const ok2 = safeSet(KEY_WELCOME_SUB, sub);
    if(ok1 && ok2){
      renderWelcome();
      welcomeMessage.textContent = '✅ Welcome text saved successfully!';
      welcomeMessage.classList.add('success');
      setTimeout(function(){
        welcomeMessage.textContent = '';
        welcomeMessage.classList.remove('success');
      }, 2000);
    } else {
      welcomeMessage.textContent = '⚠️ Could not save. Storage may be full.';
      welcomeMessage.classList.remove('success');
    }
  });

  // RESET WELCOME
  resetWelcomeBtn.addEventListener('click', function(){
    welcomeTitleInput.value = DEFAULT_TITLE;
    welcomeSubtitleInput.value = DEFAULT_SUB;
    welcomeMessage.textContent = '↺ Restored default values. Click Save to apply.';
    welcomeMessage.classList.remove('success');
  });

  // SAVE STORY
  saveStoryBtn.addEventListener('click', function(){
    const newStory = storyInput.value.trim();
    if(!newStory){
      editorMessage.textContent = '⚠️ Story cannot be empty.';
      editorMessage.classList.remove('success');
      return;
    }
    if(safeSet(KEY_STORY, newStory)){
      renderStory();
      editorMessage.textContent = '✅ Story saved successfully!';
      editorMessage.classList.add('success');
      setTimeout(function(){
        editorMessage.textContent = '';
        editorMessage.classList.remove('success');
      }, 2000);
    } else {
      editorMessage.textContent = '⚠️ Could not save. Storage may be full.';
      editorMessage.classList.remove('success');
    }
  });

  // RESET STORY
  resetStoryBtn.addEventListener('click', function(){
    storyInput.value = DEFAULT_STORY;
    editorMessage.textContent = '↺ Restored default story. Click Save to apply.';
    editorMessage.classList.remove('success');
  });

  // ================= GLOBAL KEY HANDLER =================
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(adminPanelOverlay.classList.contains('active')){ closeAdmin(); return; }
    if(modalOverlay.classList.contains('active')){ closeModal(); }
  });

  // ================= INIT =================
  window.addEventListener('load', function(){
    updateScrollProgress();
    setTimeout(updateScrollProgress, 300);
  });
})();
</script>
</body>
</html>
